
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sensor-producer
  namespace: smart-factory
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sensor-producer
  template:
    metadata:
      labels:
        app: sensor-producer
    spec:
      containers:
      - name: producer
        image: localhost/smart-factory-producer:latest
        imagePullPolicy: Never
        env:
        - name: REDIS_HOST
          value: "redis-service.smart-factory.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        - name: QUEUE_NAME
          value: "sensor_queue"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"

---
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: processing-worker
  namespace: smart-factory

spec:
  replicas: 1
  selector:
    matchLabels:
      app: processing-worker

  template:
    metadata:
      labels:
        app: processing-worker

s    spec:
      containers:
      - name: worker
        image: localhost/smart-factory-worker:v3
        imagePullPolicy: Never

        env:
        - name: REDIS_HOST
          value: "redis-service.smart-factory.svc.cluster.local"

        - name: REDIS_PORT
          value: "6379"

        - name: QUEUE_NAME
          value: "sensor_queue"

        - name: PYTHONUNBUFFERED
          value: "1"

        # Checkmk Livestatus connection
        - name: CHECKMK_ENABLED
          value: "true"

        - name: CHECKMK_HOST
          value: "192.168.0.252"

        - name: CHECKMK_PORT
          value: "6557"

        - name: CHECKMK_TLS_SERVER_NAME
          value: "cmk"

        - name: CHECKMK_CA_FILE
          value: "/etc/checkmk/ca.crt"

        - name: CHECKMK_SERVICE_DESCRIPTION
          value: "Customcheck"

        # Temperature thresholds
        - name: TEMPERATURE_WARN
          value: "95"

        - name: TEMPERATURE_CRIT
          value: "100"

        # Vibration thresholds
        - name: VIBRATION_WARN
          value: "3.0"

        - name: VIBRATION_CRIT
          value: "4.0"

        # Pressure thresholds
        - name: PRESSURE_WARN_LOW
          value: "40"

        - name: PRESSURE_WARN_HIGH
          value: "80"

        - name: PRESSURE_CRIT_LOW
          value: "35"

        - name: PRESSURE_CRIT_HIGH
          value: "85"

        volumeMounts:
        - name: checkmk-ca
          mountPath: /etc/checkmk
          readOnly: true

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"

          limits:
            memory: "256Mi"
            cpu: "500m"

      volumes:
      - name: checkmk-ca
        secret:
          secretName: checkmk-livestatus-ca
